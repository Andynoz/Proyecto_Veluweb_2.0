{% extends "todo/layout2.html" %}
{% block content %}

<header>
    <style>
    /* Gradiente personalizado para el header */
    .bg-custom-gradient {
      background: linear-gradient(135deg, #183a5e 0%, #145ba0 100%);
    }
    /* Colores personalizados para los botones */
    .btn-custom {
      background: linear-gradient(135deg, #183a5e 0%, #145ba0 100%);
    }
  </style>
</header>
<div class="max-w-2xl mx-auto mt-10 mb-10">
  <div class="flex justify-start gap-4 mt-6">
    <a href="{% url 'tabla' %}" 
       class="btn-custom text-white px-5 py-2 rounded-lg font-medium flex items-center gap-2 transition-all duration-300 hover:shadow-lg">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 inline-block" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
        </svg>
        Volver
    </a>
  </div>
  <div class="bg-white rounded-xl shadow-lg p-8 mt-8">
    <h2 class="mb-6 text-3xl font-bold text-blue-800 text-center">{{ cliente.nombre }} {{ cliente.apellido }}</h2>
    <div class="grid grid-cols-1 gap-4">
      <div class="flex justify-between items-center py-2 border-b">
        <span class="font-semibold text-gray-700">Correo:</span>
        <span class="text-dark font-bold">{{ cliente.correo }}</span>
      </div>
      <div class="flex justify-between items-center py-2 border-b">
        <span class="font-semibold text-gray-700">Teléfono:</span>
        <span class="text-dark font-bold">{{ cliente.telefono }}</span>
      </div>
      <div class="flex justify-between items-center py-2 border-b">
        <span class="font-semibold text-gray-700">Ciudad:</span>
        <span class="text-dark font-bold">{{ cliente.ciudad }}</span>
      </div>
      <div class="flex justify-between items-center py-2">
        <span class="font-semibold text-gray-700">Dirección:</span>
        <span class="text-dark font-bold">{{ cliente.direccion }}</span>
      </div>
    </div>
  </div>
</div>
{% endblock %}
