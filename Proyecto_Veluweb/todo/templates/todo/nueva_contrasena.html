{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nueva Contraseña</title>
    <link rel="stylesheet" href="{% static 'todo/styles.css' %}">
    <style>
        /* Colores personalizados para los botones */
        .btn-custom {
            background: linear-gradient(135deg, #183a5e 0%, #145ba0 100%);
        }
    </style>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'blue-custom': '#145ba0',
                        'blue-dark': '#183a5e',
                    }
                }
            }
        }
    </script>
</head>
<body class="flex justify-center items-center min-h-screen m-0 bg-gray-100 p-5">

<div class="w-full max-w-sm rounded-2xl overflow-hidden shadow-2xl bg-white">
    <!-- Sección superior con fondo azul -->
    <div class="bg-gradient-to-br from-blue-dark to-blue-custom py-10 px-8 text-center text-white">
        <div class="mb-5">
            <img src="{% static 'todo/images/logo.png' %}" alt="VeluWeb Logo" class="max-w-[120px] h-auto mx-auto">
        </div>
        <h2 class="text-2xl font-semibold m-0 text-white">- Nueva Contraseña -</h2>
    </div>

    <!-- BOTÓN: Volver al inicio -->
    <div class="fixed top-4 right-4 z-50">
        <a href="{% url 'home' %}" 
           class="inline-flex items-center gap-2 bg-white text-blue-900 px-4 py-2 rounded-full shadow-lg ring-1 ring-gray-200 hover:shadow-xl transition transform hover:-translate-y-0.5">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9.5L12 4l9 5.5V20a1 1 0 01-1 1h-5v-6H9v6H4a1 1 0 01-1-1V9.5z" />
            </svg>
            <span class="text-sm font-medium">Inicio</span>
        </a>
    </div>

    <!-- Sección inferior con fondo blanco -->
    <div class="bg-white p-8">
        <!-- Mensajes de error/éxito -->
        {% if messages %}
            {% for message in messages %}
                <div class="mb-4 p-3 rounded-lg text-sm border-l-4
                    {% if message.tags == 'error' %}bg-red-50 text-red-600 border-red-600
                    {% elif message.tags == 'success' %}bg-green-50 text-green-600 border-green-600
                    {% else %}bg-blue-50 text-blue-600 border-blue-600{% endif %}">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}

        <form method="POST">
            {% csrf_token %}
            
            <div class="mb-5 text-left relative">
                <label for="password" class="block mb-2 font-medium text-gray-800 text-sm">
                    Nueva contraseña
                    <span class="text-gray-500 text-xs">(8-50 caracteres)</span>
                </label>
                <input 
                    type="password" 
                    id="password" 
                    name="password" 
                    placeholder="Mínimo 8 caracteres"
                    required
                    minlength="8"
                    maxlength="50"
                    class="w-full py-3 px-4 pr-12 border-2 border-gray-300 rounded-lg text-sm bg-white outline-none transition-colors duration-300 focus:border-blue-custom placeholder-gray-400"
                >
                <button 
                    type="button" 
                    onclick="togglePassword('password', this)" 
                    class="absolute right-3 top-[49px] transform -translate-y-1/2 text-gray-500 hover:text-blue-custom focus:outline-none"
                >
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 pointer-events-none" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                    </svg>
                </button>
                
                <!-- Contador de caracteres -->
                <div class="text-xs text-gray-500 mt-1">
                    <span id="password-count">0</span>/50 caracteres
                </div>
                
                <!-- Indicadores de validación -->
                <div class="text-xs mt-2">
                    <div id="length-check" class="text-red-500">
                        ✗ Mínimo 8 caracteres
                    </div>
                </div>
            </div>
            
            <div class="flex justify-center mt-6">
                <button 
                    type="submit" 
                    id="submit-btn"
                    disabled
                    class="btn-custom text-white px-6 py-3 rounded-lg font-medium text-sm transition-all duration-300 hover:-translate-y-1 no-underline inline-block text-center opacity-50 cursor-not-allowed"
                >
                    Actualizar contraseña
                </button>
            </div>
            
            <div class="text-center mt-6 pt-5 border-t border-gray-300">
                <p class="text-sm text-gray-600 m-0">
                    ¿Recordaste tu contraseña? 
                    <a href="{% url 'signIn' %}" class="text-blue-dark no-underline font-semibold hover:underline">
                        Iniciar sesión
                    </a>
                </p>
            </div>
        </form>
    </div>
</div>

<script>
function togglePassword(id, btn) {
    const input = document.getElementById(id);
    const icon = btn.querySelector("svg");

    if (input.type === "password") {
        input.type = "text";
        btn.setAttribute("aria-label", "Ocultar contraseña");
        icon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.542-7a10.05 10.05 0 013.276-4.419M6.219 6.219A9.956 9.956 0 0112 5c4.477 0 8.268 2.943 9.542 7a10.05 10.05 0 01-4.257 5.285M15 12a3 3 0 11-6 0 3 3 0 016 0z" /><line x1="3" y1="3" x2="21" y2="21" stroke-width="2" stroke-linecap="round" />';
    } else {
        input.type = "password";
        btn.setAttribute("aria-label", "Mostrar contraseña");
        icon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />';
    }
}

// Validación en tiempo real
document.addEventListener('DOMContentLoaded', function() {
    const passwordInput = document.getElementById('password');
    const passwordCount = document.getElementById('password-count');
    const lengthCheck = document.getElementById('length-check');
    const submitBtn = document.getElementById('submit-btn');
    
    function validatePassword() {
        const value = passwordInput.value;
        const length = value.length;
        
        // Actualizar contador
        passwordCount.textContent = length;
        
        // Cambiar color del contador según proximidad al límite
        if (length >= 50) {
            passwordCount.style.color = '#ef4444'; // rojo
        } else if (length >= 40) {
            passwordCount.style.color = '#f59e0b'; // amarillo
        } else {
            passwordCount.style.color = '#6b7280'; // gris
        }
        
        // Validar longitud
        let isValid = true;
        
        if (length >= 8 && length <= 50) {
            lengthCheck.innerHTML = '✓ Longitud correcta (8-50 caracteres)';
            lengthCheck.className = 'text-green-500';
        } else if (length < 8) {
            lengthCheck.innerHTML = `✗ Mínimo 8 caracteres (faltan ${8 - length})`;
            lengthCheck.className = 'text-red-500';
            isValid = false;
        } else {
            lengthCheck.innerHTML = '✗ Máximo 50 caracteres';
            lengthCheck.className = 'text-red-500';
            isValid = false;
        }
        
        // Habilitar/deshabilitar botón
        if (isValid && length > 0) {
            submitBtn.disabled = false;
            submitBtn.className = 'btn-custom text-white px-6 py-3 rounded-lg font-medium text-sm transition-all duration-300 hover:-translate-y-1 no-underline inline-block text-center cursor-pointer';
            submitBtn.textContent = 'Actualizar contraseña';
        } else {
            submitBtn.disabled = true;
            submitBtn.className = 'btn-custom text-white px-6 py-3 rounded-lg font-medium text-sm transition-all duration-300 hover:-translate-y-1 no-underline inline-block text-center opacity-50 cursor-not-allowed';
            submitBtn.textContent = length === 0 ? 'Ingresa una contraseña' : 'Contraseña no válida';
        }
    }
    
    passwordInput.addEventListener('input', validatePassword);
    passwordInput.addEventListener('keyup', validatePassword);
    
    // Validación inicial
    validatePassword();
});
</script>

</body>
</html>
