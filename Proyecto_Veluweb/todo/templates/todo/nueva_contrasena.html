{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Establecer nueva contraseña</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">

    <div class="bg-white shadow-lg rounded-lg p-8 w-full max-w-md">
        <h3 class="text-2xl font-bold text-gray-800 mb-6 text-center">Nueva contraseña</h3>

        {% if messages %}
            {% for message in messages %}
                <div class="mb-4 px-4 py-3 rounded-lg text-sm 
                    {% if message.tags == 'error' %}bg-red-100 text-red-700 border border-red-300
                    {% elif message.tags == 'success' %}bg-green-100 text-green-700 border border-green-300
                    {% else %}bg-blue-100 text-blue-700 border border-blue-300{% endif %}">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}

        <form method="POST">
            {% csrf_token %}
            <div class="mb-4">
                <label for="password" class="block text-gray-700 font-medium mb-2">Nueva contraseña</label>
                <input type="password" id="password" name="password" required
                    class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 focus:outline-none">
            </div>
            
            <button type="submit" 
                class="w-full bg-green-600 hover:bg-green-700 text-white font-semibold py-3 rounded-lg transition duration-300 ease-in-out">
                Actualizar contraseña
            </button>
        </form>
    </div>

</body>
</html>
