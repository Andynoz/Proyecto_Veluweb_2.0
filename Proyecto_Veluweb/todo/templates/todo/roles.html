{% extends "todo/layout2.html" %}

{% block content %}
<header>
     <style>
        /* Gradiente personalizado para el header */
        .bg-custom-gradient {
            background: linear-gradient(135deg, #183a5e 0%, #145ba0 100%);
        }
        
        /* Colores personalizados para los botones */
        .btn-custom {
            background: linear-gradient(135deg, #183a5e 0%, #145ba0 100%);
        }
        
    </style>
</header>
<div class="max-w-6xl mx-auto mt-10 mb-10">
    <div class="bg-white rounded-xl shadow-lg p-6">

        <!-- Título -->
        <h1 class="text-center text-2xl font-bold text-dark mb-6">
            Asignar Roles a Usuarios
        </h1>

        <!-- Buscador -->
        <div class="flex flex-col sm:flex-row justify-between gap-4 mb-6">
            <input type="text" placeholder="Buscar usuario..." 
                   class="w-full sm:w-1/2 px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none shadow-sm">
            <button type="submit" class="btn-custom text-white px-8 py-3 rounded-lg font-medium text-base transition-all duration-300 hover:-translate-y-1 border-none cursor-pointer hover:shadow-xl">
              Buscar
            </button>
        </div>

        <!-- Tabla de usuarios -->
        <div class="overflow-x-auto">
            <table class="w-full border-collapse">
                <thead>
                    <tr class="bg-gray-800 text-white">
                        <th class="p-4 text-left">Usuario</th>
                        <th class="p-4 text-left">Correo</th>
                        <th class="p-4 text-center">Rol Actual</th>
                        <th class="p-4 text-center">Nuevo Rol</th>
                    </tr>
                </thead>
                <tbody>
                    {% for i in "1234" %}
                    <tr class="hover:bg-gray-50 transition-all duration-300">
                        <td class="p-4 font-medium text-gray-800">Usuario {{ i }}</td>
                        <td class="p-4 text-gray-600">usuario{{ i }}@correo.com</td>
                        <td class="p-4 text-center text-blue-700 font-semibold">Invitado</td>
                        <td class="p-4 text-center">
                            <select class="px-3 py-2 border border-gray-300 rounded-lg shadow-sm focus:ring-2 focus:ring-blue-500">
                                <option>Invitado</option>
                                <option>Administrador</option>
                                <option>Empleado</option>
                            </select>
                        </td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>

        <!-- Acciones -->
        <div class="flex justify-end gap-4 mt-6">
            <a href="#" class="btn-custom text-white px-5 py-2 rounded-lg font-medium transition-all shadow-md">
                Guardar Cambios
            </a>
        </div>

    </div>
</div>
{% endblock %}
