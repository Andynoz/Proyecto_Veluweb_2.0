{% extends "todo/layout.html" %}

{% block content %}
<style>
    /* Gradiente para el botón principal */
    .btn-custom {
        background: linear-gradient(135deg, #183a5e 0%, #145ba0 100%);
    }

    /* Estilo global para inputs y selects */
    form input,
    form select,
    form textarea {
        width: 100%;
        padding: 0.75rem;
        border: 2px solid #e5e7eb; /* gris claro */
        border-radius: 0.5rem;
        background-color: #f9fafb; /* gris muy claro */
        font-size: 0.875rem;
    }

    form input:focus,
    form select:focus,
    form textarea:focus {
        outline: none;
        border-color: #1e40af; /* azul */
        background-color: white;
    }
</style>

<div class="bg-gray-50 min-h-screen">
    <div class="max-w-3xl mx-auto p-4 sm:p-8">
        <!-- Título -->
        <h1 class="text-dark text-4xl font-semibold mb-8 text-center">Crear Producto</h1>

        <!-- Formulario -->
        <form method="post" enctype="multipart/form-data" class="bg-white rounded-xl shadow-lg p-8">
            {% csrf_token %}
            <div class="space-y-6">
                {{ form.as_p }}
            </div>

            <!-- Botones -->
            <div class="flex flex-wrap gap-4 mt-8">
                <button type="submit"
                    class="btn-custom text-white px-6 py-3 rounded-lg font-medium text-sm transition-all duration-300 hover:-translate-y-1 hover:shadow-lg border-none cursor-pointer">
                    Guardar Producto
                </button>
                <a href="{% url 'productos_index' %}"
                    class="bg-red-500 hover:bg-red-600 text-white font-medium py-3 px-8 rounded-lg text-sm transition-all duration-300 hover:-translate-y-1 hover:shadow-lg inline-block text-center no-underline">
                    Cancelar
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
