{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión</title>
    <link rel="stylesheet" href="{% static 'todo/styles.css' %}">
    <style>
        /* Gradiente personalizado para el header */
        .bg-custom-gradient {
            background: linear-gradient(135deg, #183a5e 0%, #145ba0 100%);
        }
        
        /* Colores personalizados para los botones */
        .btn-custom {
            background: linear-gradient(135deg, #183a5e 0%, #145ba0 100%);
        }
        
    </style>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'blue-custom': '#145ba0',
                        'blue-dark': '#183a5e',
                    }
                }
            }
        }
    </script>
</head>

<body class="flex justify-center items-center min-h-screen m-0 bg-gray-100 p-5">

<div class="w-full max-w-sm rounded-2xl overflow-hidden shadow-2xl bg-white">
    <!-- Sección superior con fondo azul -->
    <div class="bg-gradient-to-br from-blue-dark to-blue-custom py-10 px-8 text-center text-white">
        <div class="mb-5">
            <img src="{% static 'todo/images/logo.png' %}" alt="VeluWeb Logo" class="max-w-[120px] h-auto mx-auto">
        </div>
        <h2 class="text-2xl font-semibold m-0 text-white">- Iniciar Sesión -</h2>
    </div>

    <!-- BOTÓN: Volver al inicio -->
<div class="fixed top-4 right-4 z-50">
  <a href="{% url 'home' %}" 
     class="inline-flex items-center gap-2 bg-white text-blue-900 px-4 py-2 rounded-full shadow-lg ring-1 ring-gray-200 hover:shadow-xl transition transform hover:-translate-y-0.5">
    <!-- Icono casita -->
    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9.5L12 4l9 5.5V20a1 1 0 01-1 1h-5v-6H9v6H4a1 1 0 01-1-1V9.5z" />
    </svg>
    <span class="text-sm font-medium">Inicio</span>
  </a>
</div>

    <!-- Sección inferior con fondo blanco -->
    <div class="bg-white p-8">
        {% if error %}
            <div class="error mb-4 p-3 bg-red-100 border border-red-400 text-red-700 rounded">{{ error }}</div>
        {% endif %}
        
        <form method="POST">
            {% csrf_token %}
            
            <div class="mb-5 text-left">
                <label for="email" class="block mb-2 font-medium text-gray-800 text-sm">Correo</label>
                <input 
                    type="email" 
                    id="email" 
                    name="email" 
                    placeholder="Ingresa tu correo" 
                    required
                    class="w-full py-3 px-4 border-2 border-gray-300 rounded-lg box-border text-sm bg-white outline-none transition-colors duration-300 focus:border-blue-custom placeholder-gray-400"
                >
            </div>
            
            <div class="mb-5 text-left">
                <label for="password" class="block mb-2 font-medium text-gray-800 text-sm">Contraseña</label>
                
                <div class="relative">
                    <input 
                        type="password" 
                        id="password" 
                        name="password" 
                        placeholder="Ingresa tu contraseña" 
                        required
                        class="w-full py-3 px-4 pr-10 border-2 border-gray-300 rounded-lg text-sm bg-white outline-none transition-colors duration-300 focus:border-blue-custom placeholder-gray-400"
                    >
                    
                    <!-- Botón ojito -->
                    <button 
                        type="button" 
                        id="togglePassword" 
                        class="absolute right-4 top-[31px] -translate-y-[20px] text-gray-500 hover:text-blue-600 focus:outline-none transition-colors duration-200"
                    >
                        <!-- Ícono de ojo abierto (visible por defecto) -->
                        <svg id="eyeOpen" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                        </svg>
                        
                        <!-- Ícono de ojo cerrado (oculto por defecto) -->
                        <svg id="eyeClosed" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.542-7a9.965 9.965 0 011.193-2.13M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.94 17.94A10.07 10.07 0 0112 19c-4.478 0-8.268-2.943-9.542-7a9.965 9.965 0 012.258-3.745l12.284 12.284zM3 3l18 18" />
                        </svg>
                    </button>
                </div>
            </div>
            
            <a 
                class="block text-center my-4 mb-6 text-blue-custom text-sm no-underline transition-colors duration-300 hover:underline hover:text-blue-dark" 
                href="{% url 'recuperacion' %}"
            >
                ¿Olvidaste tu contraseña?
            </a>
            
            <div class="flex gap-4 justify-center mt-6">
                <!-- Botón Aceptar -->
                <button class="btn-custom text-white px-6 py-3 rounded-lg font-medium text-sm transition-all duration-300 hover:-translate-y-1 border-none cursor-pointer">
                    Aceptar
                </button>

                <!-- Botón Registro (como link pero con estilo de botón) -->
                <a href="{% url 'registro' %}" 
                    class="btn-custom text-white px-6 py-3 rounded-lg font-medium text-sm transition-all duration-300 hover:-translate-y-1 no-underline text-center">
                    Registro
                </a>
            </div>
        </form>
    </div>
</div>

<script>
    const togglePassword = document.getElementById("togglePassword");
    const passwordInput = document.getElementById("password");
    const eyeOpen = document.getElementById("eyeOpen");
    const eyeClosed = document.getElementById("eyeClosed");

    togglePassword.addEventListener("click", () => {
        if (passwordInput.type === "password") {
            // Mostrar contraseña
            passwordInput.type = "text";
            eyeOpen.classList.add("hidden");
            eyeClosed.classList.remove("hidden");
        } else {
            // Ocultar contraseña
            passwordInput.type = "password";
            eyeClosed.classList.add("hidden");
            eyeOpen.classList.remove("hidden");
        }
    });
</script>

</body>
</html>
