{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verificar Código</title>
    <link rel="stylesheet" href="{% static 'todo/styles.css' %}">
    <style>
        /* Colores personalizados para los botones */
        .btn-custom {
            background: linear-gradient(135deg, #183a5e 0%, #145ba0 100%);
        }
    </style>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'blue-custom': '#145ba0',
                        'blue-dark': '#183a5e',
                    }
                }
            }
        }
    </script>
</head>
<body class="flex justify-center items-center min-h-screen m-0 bg-gray-100 p-5">

      <!-- BOTÓN: Volver al inicio -->
    <div class="fixed top-4 right-4 z-50">
        <a href="{% url 'home' %}" 
           class="inline-flex items-center gap-2 bg-white text-blue-900 px-4 py-2 rounded-full shadow-lg ring-1 ring-gray-200 hover:shadow-xl transition transform hover:-translate-y-0.5">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9.5L12 4l9 5.5V20a1 1 0 01-1 1h-5v-6H9v6H4a1 1 0 01-1-1V9.5z" />
            </svg>
            <span class="text-sm font-medium">Inicio</span>
        </a>
    </div>

<div class="w-full max-w-sm rounded-2xl overflow-hidden shadow-2xl bg-white">
    <!-- Sección superior con fondo azul -->
    <div class="bg-gradient-to-br from-blue-dark to-blue-custom py-10 px-8 text-center text-white">
        <div class="mb-5">
            <img src="{% static 'todo/images/logo.png' %}" alt="VeluWeb Logo" class="max-w-[120px] h-auto mx-auto">
        </div>
        <h2 class="text-2xl font-semibold m-0 text-white">- Verificar Código -</h2>
    </div>

    <!-- Sección inferior con fondo blanco -->
    <div class="bg-white p-8">
        <!-- Mensajes de error/éxito -->
        {% if messages %}
            {% for message in messages %}
                <div class="mb-4 p-3 rounded-lg text-sm border-l-4
                    {% if message.tags == 'error' %}bg-red-50 text-red-600 border-red-600
                    {% elif message.tags == 'success' %}bg-green-50 text-green-600 border-green-600
                    {% else %}bg-blue-50 text-blue-600 border-blue-600{% endif %}">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}

        <form method="POST">
            {% csrf_token %}
            
            <div class="mb-5 text-left">
                <label for="token" class="block mb-2 font-medium text-gray-800 text-sm">
                    <i class="fas fa-shield-alt mr-2"></i>
                    Código de verificación
                </label>
                <input 
                    type="text" 
                    id="token" 
                    name="token" 
                    placeholder="Ingresa el código de 6 dígitos"
                    required
                    maxlength="6"
                    class="w-full py-3 px-4 border-2 border-gray-300 rounded-lg text-sm bg-white outline-none transition-colors duration-300 focus:border-blue-custom placeholder-gray-400 text-center tracking-widest font-mono text-lg"
                >
                <div class="text-xs text-gray-500 mt-1">
                    Revisa tu correo electrónico para obtener el código
                </div>
            </div>
            
            <div class="flex justify-center mt-6">
                <button 
                    type="submit" 
                    class="btn-custom text-white px-6 py-3 rounded-lg font-medium text-sm transition-all duration-300 hover:-translate-y-1 no-underline inline-block text-center cursor-pointer"
                >
                    <i class="fas fa-check mr-2"></i>
                    Verificar código
                </button>
            </div>
            
            <div class="text-center mt-6 pt-5 border-t border-gray-300">
                <p class="text-sm text-gray-600 m-0">
                    ¿No recibiste el código? 
                    <a href="{% url 'recuperacion' %}" class="text-blue-dark no-underline font-semibold hover:underline">
                        Enviar nuevamente
                    </a>
                </p>
            </div>
        </form>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const tokenInput = document.getElementById('token');
    
    // Formato automático del código (solo números, máximo 6)
    tokenInput.addEventListener('input', function(e) {
        let value = e.target.value.replace(/[^0-9]/g, '');
        if (value.length > 6) {
            value = value.substring(0, 6);
        }
        e.target.value = value;
        
        // Auto-submit cuando se ingresan 6 dígitos
        if (value.length === 6) {
            // Pequeño delay para mejor UX
            setTimeout(() => {
                e.target.form.submit();
            }, 500);
        }
    });
    
    // Autoenfoque en el input
    tokenInput.focus();
    
    // Prevenir espacios
    tokenInput.addEventListener('keydown', function(e) {
        if (e.key === ' ') {
            e.preventDefault();
        }
    });
    
    // Animación de entrada
    const card = document.querySelector('.w-full.max-w-sm');
    card.style.opacity = '0';
    card.style.transform = 'translateY(20px)';
    
    setTimeout(() => {
        card.style.transition = 'all 0.5s ease';
        card.style.opacity = '1';
        card.style.transform = 'translateY(0)';
    }, 100);
});
</script>

</body>
</html>
